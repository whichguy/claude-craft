name: CI

# What "CI passes" means is defined in tools/ci.sh — this file only provisions
# machines and calls it, so the same checks run on a laptop (`npm run ci`), in the
# pre-push hook and here. See docs/ci.md for the design and its rationale.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR supersedes that PR's older run. Pushes to main are never
# cancelled: each commit on main must get its own verdict (the previous group
# cancelled main runs, so some commits were never judged).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing is writable by default; each job asks for exactly what it needs.
permissions: {}

defaults:
  run:
    shell: bash

jobs:
  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Syntax, expression types and shellcheck on every `run:` block.
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

      # Security: unpinned actions, script injection, excessive permissions, credential persistence.
      - name: zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          advanced-security: false

  static:
    name: Static (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Pinned labels: `*-latest` moves under us (ubuntu-latest is migrating to 26.04
        # right now). Floating labels are exercised by the scheduled canary instead.
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changed-file checks (secrets, version bump, hermes drift) diff against the base
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: tools/ci.sh static
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # The macOS runner image ships no shellcheck; the Linux leg enforces it (the result
          # does not depend on the OS), so skip it visibly rather than install a second copy.
          CI_SKIP: ${{ runner.os == 'macOS' && 'shellcheck' || '' }}
        run: bash tools/ci.sh static

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs-static-${{ matrix.os }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  test:
    name: Test (${{ matrix.os }}, node ${{ matrix.node }}, ${{ matrix.shards }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every OS must run every shard (test/marketplace/ci-workflows.test.js enforces it).
          - { os: ubuntu-24.04, node: 22, shards: 'core claudecraft shell' } # oldest LTS we support (engines)
          - { os: ubuntu-24.04, node: 26, shards: 'core claudecraft shell' } # newest LTS, what the maintainer runs
          # Scripts here are bash/BSD-vs-GNU sensitive and users are on macOS. Hosted macOS VMs have
          # 3 cores, so three concurrent shards just contend (81-151 s); give the heavy
          # git-worktree shard its own VM instead.
          - { os: macos-26, node: 26, shards: 'core shell' }
          - { os: macos-26, node: 26, shards: 'claudecraft' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The shards of this leg run concurrently inside this one job.
      - name: tools/ci.sh test
        env:
          CI_SHARDS: ${{ matrix.shards }}
        run: bash tools/ci.sh test

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs-test-${{ matrix.os }}-node${{ matrix.node }}-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The one check to require in branch protection: it is green only if every job
  # above succeeded, so matrix legs can be added or renamed without touching
  # the protection rule.
  gate:
    name: CI gate
    needs: [workflows, static, test]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every job must have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
